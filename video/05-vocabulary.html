<!doctype html><html><head><meta charset="utf-8"><title>Cham vocabulary</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:#0d1210;color:#e8efe9;font:32px/1.4 "Inter",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;position:relative}
body.clear{background:transparent}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.g{color:#7fd35a}.m{color:#8a9a90}.r{color:#ff8a65}
.fade{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
.fade.on{opacity:1;transform:none}
.hint{position:absolute;right:24px;bottom:16px;font-size:16px;color:#4a5a50}
body.rec .hint{display:none}

.w{width:1600px;text-align:center}h2{font-size:64px;margin-bottom:50px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:24px}
.cell{background:#151c18;border-radius:16px;padding:36px 10px}.cell b{display:block;font-size:56px}.cell span{color:#8a9a90;font-size:26px}
.f{margin-top:40px;color:#8a9a90;font-size:30px}
</style></head><body>
<div class="w"><h2>Ten words</h2><div class="grid"><div class="cell fade"><b class="mono g">when</b><span>start a route</span></div><div class="cell fade"><b class="mono g">need</b><span>require fields</span></div><div class="cell fade"><b class="mono g">if</b><span>check something</span></div><div class="cell fade"><b class="mono g">not</b><span>flip it</span></div><div class="cell fade"><b class="mono g">get</b><span>find a record</span></div><div class="cell fade"><b class="mono g">all</b><span>every record</span></div><div class="cell fade"><b class="mono g">save</b><span>store a record</span></div><div class="cell fade"><b class="mono g">delete</b><span>remove records</span></div><div class="cell fade"><b class="mono g">answer</b><span>reply and stop</span></div><div class="cell fade"><b class="mono g">now</b><span>current time</span></div></div><p class="f fade">plus variables, + &minus; == != &gt; &lt;</p></div>
<div class="hint">click or R = replay &middot; T = transparent &middot; H = hide hint</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let run=0;
async function type(el,text,ms=35,id){el.textContent="";for(const c of text){if(id!==run)return;el.textContent+=c;await sleep(ms)}}
async function reveal(sel,gap=500,id){for(const e of $$(sel)){if(id!==run)return;e.classList.add("on");await sleep(gap)}}
function reset(){$$(".fade").forEach(e=>e.classList.remove("on"))}
async function play(){const id=++run;reset();await sleep(200);await scene(id)}
addEventListener("click",play);
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(k==="r")play();if(k==="t")document.body.classList.toggle("clear");if(k==="h")document.body.classList.toggle("rec")});
if(location.hash.includes("clear"))document.body.classList.add("clear");
if(location.hash.includes("rec"))document.body.classList.add("rec");
async function scene(id){await reveal(".fade",350,id)}
play();
</script></body></html>
