<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Guest book</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  input, textarea, button { font: inherit; width: 100%; margin: 4px 0; padding: 8px; box-sizing: border-box; }
  .note { border-top: 1px solid #ddd; padding: 8px 0; }
  .note button { width: auto; float: right; padding: 2px 8px; }
  #err { color: #b3261e; }
</style>
<h1>Guest book</h1>
<form id="f">
  <input name="name" placeholder="Your name">
  <textarea name="text" placeholder="Say something"></textarea>
  <button>Send</button>
</form>
<p id="err"></p>
<div id="list"></div>
<script>
const err = document.getElementById("err");

async function send(method, url, body) {
  const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body && JSON.stringify(body) });
  const data = await res.json();
  err.textContent = res.ok ? "" : data.error;
  return data;
}

async function load() {
  const notes = await send("GET", "/notes");
  document.getElementById("list").innerHTML = notes.map(n =>
    `<div class="note"><button onclick="remove(${n.id})">x</button><b>${n.name}</b>: ${n.text}</div>`).join("");
}

async function remove(id) { await send("DELETE", "/notes/" + id); load(); }

document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  await send("POST", "/notes", Object.fromEntries(new FormData(e.target)));
  load();
};
load();
</script>
